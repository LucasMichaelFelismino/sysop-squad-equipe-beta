[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sysop-squad-sprint2"
version = "0.2.0"
description = "Sysop Squad (Equipe Beta) - Sprint 2: isolamento do domínio por interfaces (DIP) e validação quantitativa"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Bibliotecas usadas só pelos adaptadores e pela composição (nunca pelo domínio).
infra = [
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "httpx>=0.27",
    "pika>=1.3",
]
dev = [
    "pytest>=8.0",
    "import-linter>=2.0",
    "fakeredis>=2.20",
    "redis>=5.0",
    "httpx>=0.27",
    "pika>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "tools"]

# Fitness functions do ADR 004: o build quebra se o domínio importar infraestrutura.
[tool.importlinter]
root_package = "sysop_squad"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Camadas: apresentacao -> infra -> dominio"
type = "layers"
layers = [
    "sysop_squad.apresentacao",
    "sysop_squad.infra",
    "sysop_squad.dominio",
]

[[tool.importlinter.contracts]]
name = "Dominio nao importa bibliotecas de infraestrutura"
type = "forbidden"
source_modules = ["sysop_squad.dominio"]
forbidden_modules = ["psycopg", "redis", "httpx", "pika"]
