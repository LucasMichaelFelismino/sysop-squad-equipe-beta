[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sysop-squad-sprint4"
version = "0.4.0"
description = "Sysop Squad (Equipe Beta) - Sprint 4: State, RabbitMQ com DLQ e retry exponencial, Circuit Breaker e contrato OpenAPI"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Bibliotecas usadas só pelos adaptadores e pela composição (nunca pelo domínio).
infra = [
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "httpx>=0.27",
    "pika>=1.3",
]
dev = [
    "pytest>=8.0",
    "import-linter>=2.0",
    "fakeredis>=2.20",
    "redis>=5.0",
    "httpx>=0.27",
    "pika>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "tools"]

# Fitness functions: o build quebra se as dependências entre camadas forem violadas.
[tool.importlinter]
root_package = "sysop_squad"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Camadas: apresentacao -> infra -> (dominio | chamados)"
type = "layers"
layers = [
    "sysop_squad.apresentacao",
    "sysop_squad.infra",
    "sysop_squad.dominio | sysop_squad.chamados",
]

[[tool.importlinter.contracts]]
name = "Dominio e Gestao de Chamados nao importam bibliotecas de infraestrutura"
type = "forbidden"
source_modules = ["sysop_squad.dominio", "sysop_squad.chamados"]
forbidden_modules = ["psycopg", "redis", "httpx", "pika"]
