name: Sprint 2 - testes e arquitetura

on:
  push:
    paths:
      - "sprint-2/**"
      - ".github/workflows/sprint-2.yml"
  pull_request:
    paths:
      - "sprint-2/**"
      - ".github/workflows/sprint-2.yml"

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sprint-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -e ".[dev,infra]"
      - name: Testes e fitness functions
        run: pytest -v
      - name: Contratos de camadas (ADR 004)
        run: lint-imports
      - name: Métricas (ADR 005)
        run: python tools/metricas.py
